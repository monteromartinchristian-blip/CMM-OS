[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmm-os"
version = "0.1.0"
description = "CMM OS"
dependencies = [
    "libcst>=1.0",
    "pypdf>=4.0",
]

requires-python = ">=3.10"

[project.optional-dependencies]
openai = [
    "openai>=2.0,<3",
    "python-dotenv>=1.0,<2",
]
validation = [
    "ruff>=0.9,<1",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "mypy>=1.10,<3",
    "vulture>=2.14,<3",
]
dev = [
    "pytest>=9,<10",
    "ruff>=0.9,<1",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "mypy>=1.10,<3",
    "vulture>=2.14,<3",
]

[project.scripts]
cmm = "cmm.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["cmm*", "cmm_agent*", "kernel*"]
