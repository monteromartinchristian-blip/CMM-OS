[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmm-os"
version = "0.1.0"
description = "CMM OS"
dependencies = ["libcst>=1.0"]

requires-python = ">=3.9"

[project.scripts]
cmm = "cmm.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["cmm*", "cmm_agent*", "kernel*"]
